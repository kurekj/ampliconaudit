[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ampliconaudit"
version = "1.0.0"
description = "Post-hoc detection of silent failures in amplicon taxonomic pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Jaroslaw Kurek", email = "jaroslaw_kurek@sggw.edu.pl" },
]
keywords = [
    "bioinformatics", "amplicon", "16S rRNA", "quality control",
    "silent failure", "audit", "provenance", "QIIME 2", "DADA2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Rdzen nie ma zaleznosci zewnetrznych - czyta wylacznie JSON i TSV
# ze standardowej biblioteki. To celowe: audyt ma dzialac wszedzie tam,
# gdzie dziala pipeline, bez wciagania wlasnego drzewa zaleznosci.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]
dev = ["pytest>=7.0"]
# Tylko do scripts/reproduce.py - testy istotnosci z Tabeli 4.
# Sam audyt nie potrzebuje niczego spoza biblioteki standardowej.
repro = ["scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/kurekj/ampliconaudit"
Repository = "https://github.com/kurekj/ampliconaudit"
Issues = "https://github.com/kurekj/ampliconaudit/issues"

[project.scripts]
ampliconaudit = "ampliconaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
